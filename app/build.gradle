plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ageed77.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ageed77.tvlauncher'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
