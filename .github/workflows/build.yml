name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tv-launcher.apk
          gh release create "build-${{ github.run_number }}" tv-launcher.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}" \
            --latest
